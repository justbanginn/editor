<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>DTDP Trainer Reveal Poster Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#eef0f6;--fg:#12142b;--panel:#fff;--bd:#d5d8e6;--ui:#2A35F5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10122a;--fg:#eceefa;--panel:#1b1e3d;--bd:#33376a}}
:root[data-theme="dark"]{--bg:#10122a;--fg:#eceefa;--panel:#1b1e3d;--bd:#33376a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 'Space Grotesk',system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--panel);border-bottom:1px solid var(--bd);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:101}
h1{font-size:15px;margin:0 8px 0 0}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;padding-top:8px;border-top:1px dashed var(--bd)}
#bar[hidden],[data-g][hidden]{display:none}
.row{display:flex;gap:6px;align-items:center}
button,select,input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
input[type=number]{width:64px;cursor:text}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
button.pri{background:var(--ui);color:#fff;border-color:var(--ui);font-weight:700}
label{display:flex;gap:5px;align-items:center;font-size:12px;opacity:.85}
#msg{font-size:12px;opacity:.8;margin-left:auto}
#stage{padding:12px 8px 40px}
#hold{position:relative;margin:0 auto}
#wrap{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#poster{position:relative;width:1080px;height:1350px;overflow:hidden;isolation:isolate;--accent:#D4FF3A;--ground:#2A35F5;background-color:var(--ground);background-image:radial-gradient(900px 700px at 80% 15%,rgba(120,140,255,.55),transparent 70%);font-family:'Space Grotesk',sans-serif;color:#fff}
.el{position:absolute;white-space:pre-wrap;cursor:move;user-select:none;-webkit-user-select:none;touch-action:none;line-height:1}
.el[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text;touch-action:auto}
.sel{outline:3px dashed #ff3fd0;outline-offset:5px}
.dec{position:absolute;pointer-events:none;background:rgba(255,255,255,.18)}
.ac{color:var(--accent)}
.glass{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}
.photo::after{content:'';position:absolute;left:0;right:0;bottom:0;height:37%;background:var(--fade);pointer-events:none}
.sw{display:flex;gap:5px;align-items:center}
.sw button{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid var(--bd)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;flex-direction:column;align-items:center;gap:10px;padding:16px;overflow:auto;color:#fff}
#modal img{max-width:100%;height:auto}
</style></head>
<body>
<header>
<h1>DTDP Poster Editor</h1>
<div class="row"><button id="add">+ Text</button><button id="rep">Replace photo</button><input type="file" id="file" accept="image/*" hidden></div>
<div class="row"><label>Background <input type="color" id="bg" value="#2a35f5"></label><label>Accent <input type="color" id="ac" value="#d4ff3a"></label></div>
<div class="row" style="margin-left:auto"><select id="res"><option value="1">1080 × 1350</option><option value="2" selected>2160 × 2700 (HD)</option><option value="3">3240 × 4050 (Ultra)</option></select><button class="pri" id="dl">Download PNG</button></div>
<div id="bar" hidden>
<div class="row" data-g="txt"><select id="ff"><option>Space Grotesk</option><option>Instrument Serif</option></select><input type="number" id="fs" min="8" max="900" title="Size"><button id="b">B</button><button id="i"><i>I</i></button><button data-al="left">⇤</button><button data-al="center">↔</button><button data-al="right">⇥</button><span class="sw" id="sw" title="Colour: selected text, or whole box if nothing is selected"></span><label title="Custom colour"><input type="color" id="tc"></label><button id="edit">Edit text</button></div>
<div class="row" data-g="fill"><label>Fill <input type="color" id="fc"></label></div>
<div class="row" data-g="img"><label>Size <input type="range" id="isz" min="200" max="1600"></label></div>
<div class="row"><button id="dup">Duplicate</button><button id="del">Delete</button><button id="fr">Front</button><button id="bk">Back</button></div>
<span id="msg">Select part of the text, then pick a colour to recolour just that part</span>
</div>
</header>

addEventListener('resize',fit);fit();
function select(el){if(sel&&sel!==el)sel.contentEditable='false';saved=null;if(sel)sel.classList.remove('sel');sel=el;if(el)el.classList.add('sel');sync()}
function sync(){bar.hidden=!sel;if(!sel)return;const k=sel.dataset.k;
bar.querySelectorAll('[data-g]').forEach(g=>{const v=g.dataset.g;g.hidden=v==='txt'?k!=='txt':v==='fill'?!sel.dataset.fill:k!=='img'});
const cs=getComputedStyle(sel);
if(k==='txt'){$('#ff').value=/Instrument/.test(cs.fontFamily)?'Instrument Serif':'Space Grotesk';$('#fs').value=Math.round(parseFloat(cs.fontSize));$('#tc').value=hex(cs.color)}
if(sel.dataset.fill)$('#fc').value=hex(cs.backgroundColor);
if(k==='img')$('#isz').value=sel.offsetWidth}
poster.addEventListener('pointerdown',e=>{const el=e.target.closest('.el');if(!el){select(null);return}
if(el.isContentEditable)return;select(el);
const sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;el.setPointerCapture(e.pointerId);
const mv=v=>{el.style.left=Math.round(ox+(v.clientX-sx)/sc)+'px';el.style.top=Math.round(oy+(v.clientY-sy)/sc)+'px'};
const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up)};
el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)});
function edit(el){if(!el||el.dataset.k!=='txt')return;el.contentEditable='true';el.focus();const r=document.createRange();r.selectNodeContents(el);getSelection().removeAllRanges();getSelection().addRange(r)}
poster.addEventListener('dblclick',e=>{const el=e.target.closest('.el');if(el&&!el.isContentEditable)edit(el)});
poster.addEventListener('focusout',e=>{const r=e.relatedTarget;if(e.target.contentEditable==='true'&&!(r&&r.closest&&r.closest('header')))e.target.contentEditable='false'});
$('header').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
const hasSel=()=>{const s=getSelection();return !!(sel&&sel.isContentEditable&&s.rangeCount&&!s.isCollapsed&&sel.contains(s.anchorNode)&&sel.contains(s.focusNode))};
document.addEventListener('selectionchange',()=>{if(hasSel())saved=getSelection().getRangeAt(0).cloneRange()});
function inline(cmd,v){document.execCommand('styleWithCSS',false,true);document.execCommand(cmd,false,v)}
function useSaved(){if(hasSel())return true;if(saved&&sel&&sel.contains(saved.commonAncestorContainer)){sel.contentEditable='true';sel.focus();const s=getSelection();s.removeAllRanges();s.addRange(saved);return true}return false}
function applyColor(v){if(!sel)return;if(useSaved()){inline('foreColor',v);return}
sel.style.color=v;sel.querySelectorAll('.ac').forEach(s=>s.classList.remove('ac'));sel.querySelectorAll('[style*="color"]').forEach(s=>s.style.color='')}
['#D4FF3A','#FFFFFF','#0B0F3A','#FF5C8A','#FFB020','#3AF0FF','#9B5CFF'].forEach(c=>{const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>applyColor(c);$('#sw').appendChild(b)});
$('#edit').onclick=()=>edit(sel);
document.addEventListener('keydown',e=>{if(!sel)return;if(sel.isContentEditable){if(e.key==='Escape')sel.blur();return}
if(/INPUT|SELECT/.test(document.activeElement.tagName)&&e.key!=='Escape')return;
const st=e.shiftKey?10:1,m={ArrowLeft:['left',-st],ArrowRight:['left',st],ArrowUp:['top',-st],ArrowDown:['top',st]}[e.key];
if(m){e.preventDefault();sel.style[m[0]]=sel[m[0]==='left'?'offsetLeft':'offsetTop']+m[1]+'px'}
else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del()}
else if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();dup()}
else if(e.key==='Escape')select(null)});
function dup(){if(!sel)return;const c=sel.cloneNode(true);c.classList.remove('sel');c.removeAttribute('id');c.contentEditable='false';c.style.left=sel.offsetLeft+30+'px';c.style.top=sel.offsetTop+30+'px';c.style.zIndex=++z;poster.appendChild(c);select(c)}
function del(){if(sel){sel.remove();select(null)}}
